spring.profiles.active=h2
spring.application.name=esports-arena-api
server.port=${PORT:8080}


# --- Base de datos MySQL (se puede sobreescribir con variables de entorno) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/esports_arena?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
# En produccion definir JWT_SECRET (Base64, minimo 32 bytes). El valor por defecto es SOLO para desarrollo.
app.jwt.secret=${JWT_SECRET:Iuk5bD1UKDkQDCljHF+DltQs8P4DHLSccFb7QK4ilXpjaEXB8o2UOAzl1pV1m6WF}
app.jwt.access-minutes=15
app.jwt.refresh-days=7

# --- CORS (origen del frontend React/Vite) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
